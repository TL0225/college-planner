[extend]
# Start from gitleaks default rules, then add allowlists.
useDefault = true

[allowlist]
description = "Allow known non-secret identifiers"
paths = [
  # Google OAuth client IDs / redirect URIs are public identifiers (not secrets).
  '''College/Info.plist''',
  # Captured HTML/JSON fixtures may contain third-party public app keys.
  '''CollegeTests/Fixtures/''',
  '''College/Features/.*/Fixtures/''',
]

regexes = [
  # Allow OAuth client IDs and URL schemes.
  '''com\.googleusercontent\.apps\.[0-9\-]+''',
  '''[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com''',
]

