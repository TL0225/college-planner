<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>iCIMS Apply Fixture</title></head>
<body>
  <form id="icims_apply_form">
    <input type="text" aria-label="First Name" name="firstName" />
    <input type="text" aria-label="Last Name" name="lastName" />
    <input type="email" name="Email" aria-label="Email Address" />
    <label>Are you authorized to work in the United States?
      <select aria-label="authorized to work">
        <option value="">Choose</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </label>
  </form>
</body>
</html>
