[package]
name = "college"
version = "0.1.0"
description = "College — single-codebase cross-platform desktop app"
authors = ["College"]
edition = "2021"
rust-version = "1.77"
default-run = "college"

[lib]
name = "college_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "college"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "backup", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
scraper = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1"
pdf-extract = "0.8"
notify = "7"
notify-debouncer-full = "0.4"
zip = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Data_Pdf",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_WinRT",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_Storage_FileSystem",
] }
raw-window-handle = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "import_swift_workspace"
path = "src/bin/import_swift_workspace.rs"
