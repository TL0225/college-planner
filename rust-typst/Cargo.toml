[package]
name = "college-typst"
version = "0.1.0"
edition = "2021"
description = "Embedded Typst compiler for College resume PDF generation"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
chrono = { version = "0.4", features = ["clock"] }
