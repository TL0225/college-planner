name: Catalog live nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-live:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run Tier 1 catalog URL discovery smoke
        run: |
          bash scripts/run-catalog-tier1-live.sh

      - name: Run Tier 2 live catalog verification suite
        run: |
          bash scripts/run-catalog-tier2-live.sh
