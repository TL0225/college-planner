name: Academic calendar tests

on:
  push:
    paths:
      - "College/**"
      - "CollegeTests/**"
      - "Packages/CollegeCalendar/**"
      - "scripts/run_academic_calendar_tests.sh"
      - "College.xcodeproj/**"
      - ".github/workflows/academic-calendar-tests.yml"
  pull_request:
    paths:
      - "College/**"
      - "CollegeTests/**"
      - "Packages/CollegeCalendar/**"
      - "scripts/run_academic_calendar_tests.sh"
      - "College.xcodeproj/**"
      - ".github/workflows/academic-calendar-tests.yml"

permissions:
  contents: read

jobs:
  academic-calendar-unit-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run academic calendar XCTest suite (non-live)
        run: bash scripts/run_academic_calendar_tests.sh

  academic-calendar-live-matrix:
    runs-on: macos-26
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live extraction matrix
        run: |
          bash scripts/college-xcodebuild-test.sh \
            -scheme College \
            -destination 'platform=macOS' \
            -only-testing:CollegeTests/AcademicCalendarLiveExtractionReportTests \
            CODE_SIGNING_ALLOWED=NO \
            test
