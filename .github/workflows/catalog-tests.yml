name: Catalog tests

on:
  push:
    paths:
      - "College/**"
      - "CollegeTests/**"
      - "scripts/run_catalog_tests.sh"
      - "scripts/verify-catalog-manifest-urls.sh"
      - "College.xcodeproj/**"
      - ".github/workflows/catalog-tests.yml"
  pull_request:
    paths:
      - "College/**"
      - "CollegeTests/**"
      - "scripts/run_catalog_tests.sh"
      - "scripts/verify-catalog-manifest-urls.sh"
      - "College.xcodeproj/**"
      - ".github/workflows/catalog-tests.yml"

permissions:
  contents: read

jobs:
  catalog-unit-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run catalog XCTest suite
        run: bash scripts/run_catalog_tests.sh

      - name: Verify catalog manifest URL/format
        run: bash scripts/verify-catalog-manifest-urls.sh
