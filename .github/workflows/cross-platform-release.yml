name: Cross-platform release (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            os_name: macos
          - platform: windows-latest
            args: ""
            os_name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets on release tags
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          missing=0
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then echo "Missing TAURI_SIGNING_PRIVATE_KEY"; missing=1; fi
          if [ "${{ matrix.os_name }}" = "macos" ]; then
            if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ]; then echo "Missing APPLE_CERTIFICATE"; missing=1; fi
            if [ -z "${{ secrets.APPLE_ID }}" ]; then echo "Missing APPLE_ID"; missing=1; fi
            if [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then echo "Missing APPLE_TEAM_ID"; missing=1; fi
          fi
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            if [ -z "${{ secrets.WINDOWS_CERTIFICATE }}" ]; then echo "Missing WINDOWS_CERTIFICATE"; missing=1; fi
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Production desktop-v* releases require signing secrets. Refusing unsigned ship."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os_name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: CollegeDesktop/src-tauri -> target

      - name: Verify bundled AI models
        working-directory: CollegeDesktop/src-tauri
        shell: bash
        run: |
          test -f resources/models/embed-384.clm || cargo build -q
          test -f resources/models/embed-384.clm
          test -f resources/models/parse-instruct.clm
          test -f resources/models/MANIFEST.sha256

      - name: Install frontend dependencies
        working-directory: CollegeDesktop
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: CollegeDesktop
          tagName: ${{ github.ref_name }}
          releaseName: College ${{ github.ref_name }}
          releaseBody: |
            Production College desktop (Windows 11 + macOS Tahoe).
            Bundled on-device AI models included. Single portable College.sqlite.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: CollegeDesktop
      - run: bun run typecheck
        working-directory: CollegeDesktop
