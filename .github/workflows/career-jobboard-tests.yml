name: Career Job Board Tests

on:
  pull_request:
    paths:
      - 'College/Features/Career/Job Board/**'
      - 'College/Features/Career/Job Board Scrapers/**'
      - 'College/Features/Career/Services/CareerATSService.swift'
      - 'College/Features/Career/Services/CareerResumeRoleFitAnalyzer.swift'
      - 'College/Features/Career/Services/CareerResumeHashing.swift'
      - 'College/Core/Data/Repositories/CareerRepository+JobBoard*.swift'
      - 'College/Core/Data/Repositories/CareerRepository+ResumeJobMatch.swift'
      - 'CollegeTests/Features/Career/Openings/**'
      - 'CollegeTests/Fixtures/JobBoard/**'
      - '.github/workflows/career-jobboard-tests.yml'
  schedule:
    - cron: '0 8 * * *'

jobs:
  openings-pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Openings Swift Testing smoke
        run: |
          set -euo pipefail
          bash scripts/college-xcodebuild-test.sh \
            -project College.xcodeproj \
            -scheme College \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/CollegeJobBoardCI \
            -only-testing:CollegeTests/JobBoardMatchEligibilityTests \
            -only-testing:CollegeTests/JobBoardConfigTests \
            -only-testing:CollegeTests/JobBoardCompaniesStoreTests \
            -only-testing:CollegeTests/JobBoardCompanyConfiguratorTests \
            -only-testing:CollegeTests/JobBoardSyncCoordinatorBehaviorTests \
            -only-testing:CollegeTests/JobBoardImportPipelineTests \
            -only-testing:CollegeTests/JobBoardListMatchBadgeTests \
            -only-testing:CollegeTests/JobBoardDetailHashTests \
            -only-testing:CollegeTests/JobBoardSQLiteFixtureTests \
            -only-testing:CollegeTests/JobBoardRobotsPolicyTests \
            -only-testing:CollegeTests/JobBoardStructuredDataParserTests \
            -only-testing:CollegeTests/WorkdayURLContextTests \
            -only-testing:CollegeTests/ATSScraperIdentifierTests \
            -only-testing:CollegeTests/BuiltInScraperTests \
            -only-testing:CollegeTests/JobBoardPublicHubPipelineTests \
            -only-testing:CollegeTests/USAJobsScraperTests \
            -only-testing:CollegeTests/NYCCityJobsScraperTests \
            -only-testing:CollegeTests/NYStateJobsScraperTests \
            test \
            | xcpretty

  openings-nightly-full:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Full Openings Swift Testing suite
        run: |
          set -euo pipefail
          bash scripts/college-xcodebuild-test.sh \
            -project College.xcodeproj \
            -scheme College \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/CollegeJobBoardNightly \
            -only-testing:CollegeTests/JobBoardMatchEligibilityTests \
            -only-testing:CollegeTests/JobBoardConfigTests \
            -only-testing:CollegeTests/JobBoardCompaniesStoreTests \
            -only-testing:CollegeTests/JobBoardCompanyConfiguratorTests \
            -only-testing:CollegeTests/JobBoardSyncTests \
            -only-testing:CollegeTests/JobBoardSyncCoordinatorBehaviorTests \
            -only-testing:CollegeTests/JobBoardScraperRegistryTests \
            -only-testing:CollegeTests/JobBoardImportPipelineTests \
            -only-testing:CollegeTests/JobBoardReadUITests \
            -only-testing:CollegeTests/JobBoardListMatchBadgeTests \
            -only-testing:CollegeTests/JobBoardDetailHashTests \
            -only-testing:CollegeTests/JobBoardDetailScrapeGateTests \
            -only-testing:CollegeTests/CareerResumeEligibilityTests \
            -only-testing:CollegeTests/CareerATSServiceGateTests \
            -only-testing:CollegeTests/CareerResumeRoleFitAnalyzerGateTests \
            -only-testing:CollegeTests/JobBoardTrackerTests \
            -only-testing:CollegeTests/JobBoardPipelineE2ETests \
            -only-testing:CollegeTests/JobBoardSQLiteFixtureTests \
            -only-testing:CollegeTests/JobBoardRobotsPolicyTests \
            -only-testing:CollegeTests/JobBoardStructuredDataParserTests \
            -only-testing:CollegeTests/WorkdayURLContextTests \
            -only-testing:CollegeTests/ATSScraperIdentifierTests \
            -only-testing:CollegeTests/BuiltInScraperTests \
            -only-testing:CollegeTests/JobicyScraperTests \
            -only-testing:CollegeTests/RemoteOKScraperTests \
            -only-testing:CollegeTests/YCombinatorScraperTests \
            -only-testing:CollegeTests/JobBoardPublicHubPipelineTests \
            -only-testing:CollegeTests/USAJobsScraperTests \
            -only-testing:CollegeTests/NYCCityJobsScraperTests \
            -only-testing:CollegeTests/NYStateJobsScraperTests \
            -only-testing:CollegeTests/GovernmentJobBoardLiveTests \
            -only-testing:CollegeTests/BuiltInScraperLiveTests \
            test \
            | xcpretty
        env:
          COLLEGE_RUN_LIVE_TESTS: "1"
          COLLEGE_USAJOBS_API_KEY: ${{ secrets.COLLEGE_USAJOBS_API_KEY }}
          COLLEGE_USAJOBS_USER_EMAIL: ${{ secrets.COLLEGE_USAJOBS_USER_EMAIL }}
