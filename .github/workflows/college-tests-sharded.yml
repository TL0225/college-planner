name: College tests (sharded)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  college-tests-sharded:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run sharded CollegeTests
        run: bash scripts/run-college-test-shards.sh
