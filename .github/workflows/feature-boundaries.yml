name: Feature boundaries

on:
  push:
    paths:
      - "College/Features/**"
      - "College/Core/**"
      - "Packages/**"
      - "CollegePlatform/**"
      - "scripts/check-feature-imports.sh"
      - ".github/workflows/feature-boundaries.yml"
  pull_request:
    paths:
      - "College/Features/**"
      - "College/Core/**"
      - "Packages/**"
      - "CollegePlatform/**"
      - "scripts/check-feature-imports.sh"
      - ".github/workflows/feature-boundaries.yml"

permissions:
  contents: read

jobs:
  feature-boundaries:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-feature import gate (fail mode)
        run: bash scripts/check-feature-imports.sh fail
