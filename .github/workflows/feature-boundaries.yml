name: Feature boundaries

on:
  push:
    paths:
      - "College/Features/**"
      - "College/Core/**"
      - "Packages/**"
      - "CollegePlatform/**"
      - "scripts/check-feature-imports.sh"
      - "scripts/generate-cursor-feature-rules.py"
      - "scripts/feature-touch-manifest.json"
      - ".cursor/rules/feature-boundaries-master.mdc"
      - ".cursor/rules/features/**"
      - ".github/workflows/feature-boundaries.yml"
  pull_request:
    paths:
      - "College/Features/**"
      - "College/Core/**"
      - "Packages/**"
      - "CollegePlatform/**"
      - "scripts/check-feature-imports.sh"
      - "scripts/generate-cursor-feature-rules.py"
      - "scripts/feature-touch-manifest.json"
      - ".cursor/rules/feature-boundaries-master.mdc"
      - ".cursor/rules/features/**"
      - ".github/workflows/feature-boundaries.yml"

permissions:
  contents: read

jobs:
  feature-boundaries:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-feature import gate (fail mode)
        run: bash scripts/check-feature-imports.sh fail

      - name: Cursor feature rules up to date
        run: python3 scripts/generate-cursor-feature-rules.py --check
