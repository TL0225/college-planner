name: Release hardening checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-release-checks:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify entitlements have no temporary exceptions
        run: |
          if plutil -p "College/College.entitlements" | grep -q "temporary-exception"; then
            echo "ERROR: temporary exception entitlements found"
            exit 1
          fi

      - name: Verify share extension app group matches main app
        run: bash scripts/check-share-extension-entitlements.sh

      - name: Verify hardened runtime is enabled (Release)
        run: |
          xcodebuild -project "College.xcodeproj" -scheme "College" -configuration Release -showBuildSettings | grep -E "^ *ENABLE_HARDENED_RUNTIME = YES"

      - name: No Core Data symbols
        run: bash scripts/check-no-coredata.sh

      - name: Neutral persistence label gate
        run: bash scripts/check-neutral-persistence-labels.sh

      - name: Platform boundary gate
        run: bash scripts/check-platform-boundary.sh

      - name: No vision LLM symbols
        run: bash scripts/check-no-vision-llm.sh

      - name: No Gemma 4 symbols
        run: bash scripts/check-no-gemma4.sh

      - name: Build (Release)
        run: |
          source scripts/xcodebuild-typst-flags.sh -configuration Release
          xcodebuild -skipPackagePluginValidation -skipMacroValidation -project "College.xcodeproj" -scheme "College" -configuration Release build CODE_SIGNING_ALLOWED=NO "${XCODEBUILD_TYPST_ARGS[@]}"
