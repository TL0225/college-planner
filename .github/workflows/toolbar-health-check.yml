name: Toolbar health check

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-report:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate toolbar health report
        run: bash scripts/toolbar-health-check.sh

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbar-health-report
          path: toolbar-health-report.json
